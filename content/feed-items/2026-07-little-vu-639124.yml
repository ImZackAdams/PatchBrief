title: 'VU#639124: Multiple local privilege escalation vulnerabilities in Little Orbits
  GameFirst Anti-Cheat'
summary: 'Overview The GamersFirst Anti-Cheat (GFAC) driver GFAC.sys contains multiple
  local privilege escalations and denial-of-service vulnerabilities stemming from
  insecure handling of user-controlled input through a minifilter communication port.
  A local attacker can abuse these flaws to perform arbitrary kernel memory writes,
  obtain privilege escalation to SYSTEM, or trigger a system crash. Description GFAC
  is a proprietary anti-cheat software developed by video game publisher Little Orbit.
  GFAC includes a kernel-mode driver, GFAC_Sys_x64.sys , that exposes privileged functionality
  to user-mode applications through a minifilter communication port. Although these
  low-level interfaces are necessary for the software''s operation, vulnerabilities
  can arise if user-mode access is not properly restricted and validated. CVE-2026-12166...
  Related CVEs: CVE-2026-12166, CVE-2026-12167, CVE-2026-12168.'
