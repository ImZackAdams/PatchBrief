title: 'VU#987105: The nothings stb TrueType library, up to version 1.26, contains
  a heap buffer overflow vulnerability'
summary: 'Overview A heap buffer overflow vulnerability exists in the stb TrueType
  library created by nothings. Exploitation of this vulnerability can occur when handling
  malformed font data and may lead to both Denial of Service (DoS) and Information
  Disclosure. Description The nothings stb repository, versions 1.26 and earlier,
  contains a collection of single-file public domain and MIT-licensed libraries for
  C/C++ projects. CVE-2026-18497 A heap buffer overflow vulnerability exists in the
  stbtt_GetGlyphShape() function within the stb_truetype.h library when handling malformed
  TrueType Font (TTF) data. The issue occurs during glyph contour parsing. The function
  iterates based on the number of contour endpoints specified in endPtsOfContours
  , but does not validate that the points pointer remains within the bounds of the
  glyph data buffer. As a... Related CVEs: CVE-2026-18497.'
