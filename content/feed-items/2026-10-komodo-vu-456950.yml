title: 'VU#456950: Komodo Periphery Agent Contains an OS Command Injection Vulnerability'
summary: 'Overview Versions root on the underlying host, enabling persistent compromise
  of infrastructure. Description Komodo is an open-source server and deployment manager,
  maintained by mogh.tech, widely used in self-hosted and Docker multi-server environments.
  Periphery is an agent service installed on servers to give Komodo control over Docker
  environments. In vulnerable versions of Komodo, Periphery does not properly validate
  user-supplied Docker container names before those values are interpolated into shell
  commands used by the agent. Two operations exhibit this vulnerability: container
  destruction ( DestroyContainer / RemoveContainer ) and container log searches (
  SearchContainerLog / GetContainerLogSearch ). Through both avenues, raw container
  names are directly inserted into sh -c command lines without any shell escaping
  or validation...'
