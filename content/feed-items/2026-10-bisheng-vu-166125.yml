title: 'VU#166125: Bisheng has authentication bypass vulnerabilities'
summary: 'Overview Bisheng contains three vulnerabilities: a pre-authentication account
  takeover mechanism via a legacy single sign-on (SSO) endpoint; an Insecure Direct
  Object Reference (IDOR) vulnerability that exposes cross-user workflow data; and
  prior to version 2.5.0, authenticated attackers could perform cross-user LLM credential
  abuse and data disclosure due to missing service-layer access checks. Together,
  these flaws could allow unauthenticated attackers to gain administrative control
  while enabling authenticated users access to sensitive data and hardcoded credentials.
  Description Bisheng is an open-source Large Language Model (LLM) application DevOps
  platform, developed by DataElement, designed to assist in building, managing, and
  scaling LLMs. CVE-2026-96679 (Legacy SSO Bypass) A vulnerability resides in the
  legacy SSO endpoint ( POST... Related CVEs: CVE-2026-100156, CVE-2026-96679, CVE-2026-96681.'
