title: 'VU#944667: ComfyUI-Easy-Use contains unauthenticated path traversal vulnerability'
summary: Overview ComfyUI-Easy-Use version 1.4.1 and earlier contains a vulnerability
  in its save_preview() handler that allows an unauthenticated attacker to overwrite
  an installed custom node’s Python file. An attacker who can reach the affected ComfyUI
  instance over the network can use the overwrite to execute arbitrary code when ComfyUI
  restarts. Description ComfyUI is a node-based interface for building generative
  AI workflows. ComfyUI-Easy-Use is an extension that adds custom nodes and workflow
  utilities. An attacker can upload a Python file to ComfyUI’s input directory then
  use save_preview() to copy that file over an installed custom node’s __init__.py
  . Upon restart, ComfyUI will import and execute the modified node. Remote exploitation
  requires a deployment that exposes the affected routes to the attacker without authentication.
