title: 'VU#580079: Arbitrary file read/write vulnerability in ImageMagick-based applications
  with default configuration'
summary: 'Overview Multiple arbitrary file read and write vulnerabilities have been
  identified in applications that use ImageMagick with insufficiently restrictive
  security policies. Collectively referred to as ImageTragick2 , these issues arise
  when ImageMagick processes attacker-controlled SVG or PostScript content using dangerous
  coders or delegates permitted by its default or application-supplied configuration.
  An attacker who can upload an image, or otherwise cause an application to process
  crafted image content, may be able to read or write files accessible to the ImageMagick
  process. In some deployments, these capabilities may be chained to achieve arbitrary
  code execution, compromising the confidentiality, integrity, and availability of
  the affected application and host. Description ImageMagick is a widely used open-source
  image-processing... Related CVEs: CVE-2026-65640.'
