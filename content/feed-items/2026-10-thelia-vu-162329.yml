title: 'VU#162329: Multiple vulnerabilities in Thelia 2.6.0 and 2.6.1'
summary: 'Overview Thelia versions 2.6.0 and 2.6.1 contain multiple vulnerabilities
  relating to file management, Smarty templating, module installation, and administrative
  workflows. Successful exploitation of these issues could enable remote code execution
  (RCE), server-side template injection (SSTI), stored and reflected cross-site scripting
  (XSS), unauthorized URL redirection, and other risks that expose both server-side
  and client-side attack surfaces. Description Thelia is an open-source e-commerce
  platform designed to provide merchants with customizable online storefronts, product
  management workflows, and administrative functionalities. It utilizes the Smarty
  template engine and provides administrators with broad control over templates, content,
  and modules. CVE-2026-103521 In Thelia v2.6.0, the document upload endpoint properly
  blocks the... Related CVEs: CVE-2026-103521, CVE-2026-103522, CVE-2026-103523, CVE-2026-103524.'
