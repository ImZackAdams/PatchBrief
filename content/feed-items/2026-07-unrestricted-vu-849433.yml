title: 'VU#849433: Adalo Database API Enables Cross-App User Data Extraction via Over-Fetching
  and Missing Authorization Cont...'
summary: 'Overview Adalo’s no‑code application platform exposes complete user records
  through its database API for all applications built on both V1 and V2. Due to a
  platform-level flaw, authenticated users can retrieve full user data belonging to
  any Adalo application, regardless of configuration. This issue affects more than
  one million applications and placing developers and their end users at risk of data
  exposure that they cannot prevent or remediate. Description Adalo is a Software-as-a-Service
  (SaaS) provider for building no-code applications. In theory, each application or
  tenant (customer) is logically isolated with separate databases, users, and configurations.
  CVE-2026-10706 Unrestricted Disclosure of Full User Records The Adalo database API
  contains a flaw which allows the backend to return complete user records for every
  list... Related CVEs: CVE-2026-10706, CVE-2026-10708.'
