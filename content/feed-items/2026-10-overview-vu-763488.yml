title: 'VU#763488: Memory corruption vulnerabilities in PHP'
summary: 'Overview Two memory-related vulnerabilities have been identified in PHP
  versions prior to 8.2.35, 8.3.36, 8.4.27, and 8.5.12. An unauthenticated remote
  attacker with network access to PHP web services can exploit these vulnerabilities
  via specially crafted HTTP requests to potentially achieve arbitrary code execution.
  Description PHP is a widely used open-source scripting language designed for web
  development and server-side applications. It powers millions of websites and web
  applications worldwide and can be deployed through a variety of server configurations,
  including PHP-FPM, Apache with mod_php, php-cgi, FrankenPHP, and LiteSpeed. CVE-2026-109618
  : A memory corruption vulnerability exists in the out-of-memory (OOM) handling mechanism
  of PHP versions prior to 8.2.35, 8.3.36, 8.4.27, and 8.5.12. The vulnerability occurs
  when an OOM... Related CVEs: CVE-2026-109618, CVE-2026-109619.'
