title: 'VU#124705: BaseChat – Audio Dating App, Android version 9.8.1, contains multiple
  vulnerabilities'
summary: 'Overview Multiple vulnerabilities have been identified in the Android application,
  BaseChat – Audio Dating App, version 9.8.1, which ultimately compromise the privacy
  of users’ personal data and activity. Description BaseChat is an online dating platform
  built in Flutter and targeted toward users over 18. It facilitates anonymous, voice-first
  interaction between users. Three distinct vulnerabilities have been identified within
  the shipped Android application. VU#124705.1: The application fails open when validating
  TLS server certificates for connections to its backend API host. The application
  allows any self-signed certificate to bypass standard TLS security checks. VU#124705.2:
  Paid user accounts are mapped to a third-party RevenueCat subscriber database using
  raw MSISDNs (phone numbers), which are a guessable public identifier...'
