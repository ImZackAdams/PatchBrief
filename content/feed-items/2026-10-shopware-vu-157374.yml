title: 'VU#157374: XSS vulnerability in Shopware 6 enables Admin Token Theft and RCE'
summary: 'Overview Shopware 6.7 contains a stored cross-site scripting (XSS) vulnerability
  in its media upload functionality that can lead to administrator credential compromise
  and remote code execution. Description Shopware is an open-source e-commerce platform
  used to build and manage online stores. It provides merchants with customizable
  product pages, administrative interfaces, plugin functionality, and a media management
  system that allows users to upload and serve files. CVE-2026-104937 In affected
  versions, Shopware’s media upload API accepts HTML files that are later served as
  text/html without effective Content-Security-Policy or X-Content-Type-Options security
  headers. An attacker with access to the media upload capability can therefore upload
  an HTML file with malicious embedded JavaScript, and if an administrator opens the...
  Related CVEs: CVE-2026-104937.'
