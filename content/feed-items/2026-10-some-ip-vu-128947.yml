title: 'VU#128947: COVESA vsomeip excessive memory allocation in reliable (TCP) endpoint
  buffer handling'
summary: 'Overview vsomeip, COVESA''s open source implementation of the SOME/IP automotive
  communication middleware, contained a memory allocation vulnerability present in
  versions 3.7.3 and below. A vsomeip reliable (TCP) SOME/IP endpoint grows its receive
  buffer to an attacker-declared message size before validating that the declared
  bytes have actually been received, allowing a remote, unauthenticated peer to exhaust
  host memory and deny service. The issue was reported publicly as COVESA/vsomeip
  issue #1009 and fixed in release 3.7.4 (2026-07-06). Description CVE-2026-91141
  vsomeip is a middleware implementation of the Scalable service-Oriented MiddlewarE
  over IP (SOME/IP) protocol, widely used for service-oriented communication between
  electronic control units (ECUs) in automotive and other embedded environments. A
  SOME/IP message begins with a... Related CVEs: CVE-2026-91141.'
