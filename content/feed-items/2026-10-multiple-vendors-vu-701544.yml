title: 'VU#701544: mpc-lib hardened derivation fails to protect ancestor isolation'
summary: 'Overview Fireblocks'' mpc-lib library contains a cryptographic fail-open
  vulnerability in its BIP32 hardened derivation implementation in the case of a missing
  private parent key. This breaks the ancestor isolation property of hardened derivation,
  allowing an attacker with a compromised lower-level signer share to recover the
  higher-level share it was derived from. Description Fireblocks is a digital-asset
  custody and wallet platform that secures the private keys behind cryptocurrency
  wallets for institutions and exchanges, using multi-party computation (MPC) so that
  no single machine ever holds a complete key. Fireblocks’ key security pipeline contains
  two layers: MPC, which splits a single key into shares, and hardened derivation,
  which mathematically isolates each share from its key hierarchy. Normally, the derivation
  delta between... Related CVEs: CVE-2026-90975.'
