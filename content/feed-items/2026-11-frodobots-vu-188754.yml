title: 'VU#188754: FrodoBots EarthRover Mini+ firmware contains multiple vulnerabilities'
summary: 'Overview Multiple vulnerabilities in the FrodoBots EarthRover Mini+ firmware
  (version 6.2.4_6.2.5_0.614.0) may allow remote code execution, unauthorized access
  to onboard sensors, disclosure of sensitive information, and full compromise of
  affected devices. Exploitation may enable an attacker to remotely control the rover,
  access audiovisual streams, or pivot into the user’s network. Description The FrodoBots
  EarthRover Mini+ is a compact, internet‑connected mobile robot used in educational
  and consumer environments. The device includes a camera, microphone, motor controllers,
  and multiple onboard services. Multiple vulnerabilities in the EarthRover Mini+
  firmware (version 6.2.4_6.2.5_0.614.0) can allow remote code execution, unauthorized
  access to onboard sensors, exposure of sensitive data, and complete device compromise.
  An attacker... Related CVEs: CVE-2026-121685, CVE-2026-121686, CVE-2026-121687,
  CVE-2026-121688.'
