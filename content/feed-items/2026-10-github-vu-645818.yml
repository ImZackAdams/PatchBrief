title: 'VU#645818: Xerj Console API Authentication Bypass Leads to Unauthorized Credential
  Minting'
summary: 'Overview An authentication bypass vulnerability in the Xerj Console API
  allows sessions to bypass passkey-backed requirements during token issuance. By
  exploiting this flaw, an attacker with an existing valid token can create independent,
  persistent successor credentials directly through the console API. This allows the
  attacker to maintain access and potentially escalate privileges within the Xerj
  ecosystem, even if the initial token is revoked. Description Xerj is an open-source
  search and indexing engine tailored specifically for AI agents utilizing the Elasticsearch
  API, allowing AI models to query a structured index. The vulnerability, CVE-2026-97406
  , stems from a flaw in how session states are authenticated and handled within the
  Xerj system architecture. According to the documented security contract, the issuance
  of new API... Related CVEs: CVE-2026-97406.'
