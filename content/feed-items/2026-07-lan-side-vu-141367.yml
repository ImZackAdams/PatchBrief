title: 'VU#141367: AT&T''s Arris BGW210-700 gateway contains authentication bypass
  vulnerability in LAN-side management interface'
summary: 'Overview Firmware versions 2.7.7 and earlier of the Arris BGW210-700 residential
  gateway contain an authentication bypass vulnerability, tracked as CVE-2026-16771,
  that allows any unauthenticated LAN-side user to read sensitive configuration data
  and modify device settings through web management endpoints. Although this vulnerability
  was recently discovered, the majority of in-service gateways are not expected to
  be running the affected version. Only devices that have not received automated ISP-managed
  firmware updates since version 2.7.7 in 2020 are vulnerable. Description The Arris
  BGW210-700 is a residential gateway used widely in AT&T deployments to provide routing,
  wireless networking, and wide-area network (WAN) connectivity for home users. The
  device exposes a browser-based management interface on the local-area network (LAN)
  side... Related CVEs: CVE-2026-16771.'
