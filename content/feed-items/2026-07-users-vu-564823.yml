title: 'VU#564823: GNU Wget enables SSRF via unvalidated FTP PASV IPs'
summary: 'Overview GNU Wget, versions 1.25.0 and earlier, contains a server-side request
  forgery (SSRF) vulnerability in its implementation of FTP passive mode. Because
  Wget does not properly validate IP addresses obtained from PASV responses, an attacker-controlled
  FTP endpoint can redirect the client’s connection to arbitrary IPs, potentially
  exposing internal network host and service responses. This vulnerability has been
  remediated in a recent update by GNU; see the Solutions section below for resolution
  guidance. Description GNU Wget is a widely used command-line utility for retrieving
  content over HTTP, HTTPS, and FTP. When operating over FTP in passive mode, Wget
  relies on the server’s PASV response to determine which IP address and port to use
  for the data connection. CVE-2026-15146 GNU Wget does not validate the IP address
  provided by an... Related CVEs: CVE-2021-40491, CVE-2026-15146.'
