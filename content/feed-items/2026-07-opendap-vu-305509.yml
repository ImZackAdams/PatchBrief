title: 'VU#305509: OPeNDAP Hyrax is vulnerable to SSRF and Credential Disclosure'
summary: 'Overview A vulnerability has been discovered in the OPeNDAP Hyrax software
  solution. A remote attacker with the ability to submit crafted requests to an affected
  Hyrax instance could cause the application to communicate with unauthorized remote
  systems. Under certain conditions, the vulnerability may also result in the unintended
  disclosure of user authentication tokens to unauthorized destinations. Description
  CVE-2026-16637 OPeNDAP Hyrax is vulnerable to Server Side Request Forgery (SSRF)
  and credential disclosure via unvalidated HTTP redirects that bypass the AllowedHosts
  allowlist and leak Earthdata headers (User-Id, Echo-Token) to attacker-controlled
  endpoints. OPeNDAP Hyrax is an open-source data server software that enables remote
  access to scientific datasets over the internet using the OPeNDAP protocol. It allows
  users to query... Related CVEs: CVE-2026-16637.'
