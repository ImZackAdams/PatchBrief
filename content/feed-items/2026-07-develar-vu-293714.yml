title: 'VU#293714: Arbitrary File Overwrite in Develar app-builder (zipx.Unzip) via
  Symlink Following on macOS (APFS)'
summary: Overview A vulnerability in the zipx.Unzip extraction routine of Develar’s
  app-builder allows an attacker to overwrite arbitrary files on macOS using Apple
  File System (APFS). The issue arises from a combination of Unicode normalization
  collisions and unsafe symlink-following behavior. APFS treats certain Unicode equivalent
  filenames as identical (e.g., ß ↔ ss), while app builder performs no canonical normalization
  before validating or writing paths. Description Develar’s app-builder is a command‑line
  build tool used heavily in the Electron ecosystem to package, sign, notarize, and
  produce distributable application bundles for macOS, Windows, and Linux. It is popular
  because it is a transitive dependency of electron-builder, one of the most widely
  used packaging tools for Electron apps. The vulnerability arises from how the zipx.Unzip...
