title: 'VU#203719: INFINITT PACS System Manager Contains Multiple Code Execution Vulnerabilities'
summary: 'Overview INFINITT PACS installations using System Manager versions 3.0.11.3
  and 3.0.11.5 contain vulnerabilities that may allow an attacker to execute arbitrary
  code. INFINITT Healthcare has remediated the issues in System Manager versions 3.0.12.3
  and 3.0.12.5. Description INFINITT PACS is an enterprise web-based medical imaging
  platform that stores, retrieves, and displays patient scans. CVE-2026-16305 An improperly
  protected update manifest may allow a local attacker to execute commands with administrative
  privileges when an update is approved. SmartExecute.exe reads and runs commands
  from execlist.txt after an update. Because of insecure file permissions on execlist.txt
  , a low-privileged attacker can modify the file before it is processed to add arbitrary
  malicious commands. After SmartUpdate.exe launches, it runs SmartExecute.exe...
  Related CVEs: CVE-2026-16305, CVE-2026-16306.'
